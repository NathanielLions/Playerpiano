<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI to Paper Roll & String Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .controls {
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="file"], input[type="text"] {
            background: #3d3d3d;
            border: 1px solid #555;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="text"] {
            width: 250px;
            cursor: text;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        #process-btn {
            background-color: #007acc;
        }
        #process-btn:hover {
            background-color: #0062a3;
        }
        #download-btn {
            background-color: #28a745;
            display: none;
        }
        #download-btn:hover {
            background-color: #218838;
        }
        .output-box {
            background-color: #111;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #1a1a1a;
            color: #00ff66;
            font-family: "Courier New", Courier, monospace;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
        }
        .copy-btn {
            background-color: #28a745;
            margin-top: 10px;
        }
        .copy-btn:hover {
            background-color: #218838;
        }
        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
        canvas {
            border: 2px solid #444;
            background-color: #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .canvas-label {
            color: #aaa;
            font-size: 14px;
            margin-top: -15px;
            margin-bottom: 10px;
        }
        .status {
            width: 100%;
            margin-top: 5px;
            font-style: italic;
            color: #00ff66;
            font-size: 14px;
        }
    </style>
    <!-- Dependencies for parsing -->
    <script src="https://cdn.jsdelivr.net/npm/@tonaljs/tonal/browser/tonal.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
</head>
<body>

<div class="container">
    <h1>MIDI to Piano Paper Roll & String Generator</h1>
    <p>Upload a standard MIDI file to generate both a compacted timeline data string and 1024x4096 production sheets for an 84-track piano roll.</p>

    <div class="controls">
        <div class="control-group">
            <label for="midi-file">Select MIDI File:</label>
            <input type="file" id="midi-file" accept=".mid,.midi">
        </div>
        <div class="control-group">
            <label for="custom-title">Custom Download Title:</label>
            <input type="text" id="custom-title" placeholder="Enter short file name...">
        </div>
        <div class="btn-group">
            <button id="process-btn">Generate String & Roll</button>
            <button id="download-btn">Download All Images</button>
        </div>
        <div id="status" class="status"></div>
    </div>

    <!-- String Output Section -->
    <div class="output-box">
        <label for="string-output">Compacted Result Data:</label>
        <textarea id="string-output" readonly placeholder="Compacted timeline matrix string data will output here..."></textarea>
        <button class="copy-btn" id="copy-btn">Copy Data to Clipboard</button>
    </div>

    <!-- Canvas Output Section -->
    <div class="canvas-container" id="output-container">
        <!-- Layout sheets render here -->
    </div>

</div>

<script>
    // Constants for Canvas (Paper Roll)
    const CANVAS_WIDTH = 1024;
    const CANVAS_HEIGHT = 4096;
    const TRACKS_COUNT = 84;
    const TRACK_WIDTH = 12; 
    const MARGIN_X = (CANVAS_WIDTH - (TRACKS_COUNT * TRACK_WIDTH)) / 2; 
    const SCROLL_SPEED_PX_PER_SEC = 256; 

    let generatedCanvases = [];

    function getTrackTypeAndData(trackNum) {
        if (trackNum === 1 || trackNum === 75 || trackNum === 82 || trackNum === 84) {
            return { type: 'MARGINAL_SPACE' };
        }
        if (trackNum >= 2 && trackNum <= 74) {
            return { type: 'NOTE', midi: 24 + (trackNum - 2) };
        }
        if (trackNum === 76) return { type: 'CC', code: 67 }; 
        if (trackNum === 77) return { type: 'CC', code: 64 }; 
        if (trackNum === 78) return { type: 'VELOCITY_BIT', bit: 8 };
        if (trackNum === 79) return { type: 'VELOCITY_BIT', bit: 16 };
        if (trackNum === 80) return { type: 'VELOCITY_BIT', bit: 32 };
        if (trackNum === 81) return { type: 'VELOCITY_BIT', bit: 64 };
        if (trackNum === 83) return { type: 'COIN_TRIP' };
        return { type: 'UNKNOWN' };
    }

    function drawSlot(ctx, x, y, width, height) {
        if(height < width) height = width; 
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, width / 2);
        ctx.fill();
    }

    // Event listener to format custom file name on file select
    document.getElementById('midi-file').addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            const fullFileName = e.target.files[0].name;
            const strippedName = fullFileName.replace(/\.[^/.]+$/, "").replace(/\s+/g, "_");
            document.getElementById('custom-title').value = strippedName;
            document.getElementById('download-btn').style.display = 'none';
        }
    });

    document.getElementById('process-btn').addEventListener('click', async () => {
        const fileInput = document.getElementById('midi-file');
        const statusDiv = document.getElementById('status');
        const outputArea = document.getElementById('string-output');
        const outputContainer = document.getElementById('output-container');
        const downloadBtn = document.getElementById('download-btn');
        
        if (!fileInput.files.length) {
            alert('Please select a MIDI file first.');
            return;
        }

        statusDiv.innerText = "Processing MIDI file for String Data and Canvas Layout...";
        outputArea.value = "";
        outputContainer.innerHTML = ""; 
        generatedCanvases = [];

        const file = fileInput.files[0];
        const arrayBuffer = await file.arrayBuffer();
        const midi = new Midi(arrayBuffer);

        /* ==========================================
           PART 1: COMPACTED STRING COMPILATION
           ========================================== */
        let timeline = {};
        function initTimeSlot(ms) {
            if (!timeline[ms]) {
                timeline[ms] = {
                    notesOn: [], notesOff: [],
                    sustain: null, soft: null, velocitySum: 0
                };
            }
        }

        let absoluteFirstMs = Infinity;

        midi.tracks.forEach(track => {
            track.notes.forEach(note => {
                const startMs = Math.round(note.time * 1000);
                const durationMs = Math.round(note.duration * 1000);
                const endMs = startMs + Math.round(durationMs * 0.9);

                if (startMs < absoluteFirstMs) absoluteFirstMs = startMs;

                if (note.midi >= 24 && note.midi <= 96) {
                    initTimeSlot(startMs);
                    timeline[startMs].notesOn.push(note.midi);
                    initTimeSlot(endMs);
                    timeline[endMs].notesOff.push(note.midi);

                    const vel8Bit = Math.round(note.velocity * 127);
                    let runningSum = 0;
                    if (vel8Bit & 8)   runningSum += 8;
                    if (vel8Bit & 16)  runningSum += 16;
                    if (vel8Bit & 32)  runningSum += 32;
                    if (vel8Bit & 64)  runningSum += 64;

                    if (runningSum > timeline[startMs].velocitySum) {
                        timeline[startMs].velocitySum = runningSum;
                    }
                }
            });

            if (track.controlChanges) {
                for (let ccNumber in track.controlChanges) {
                    const ccList = track.controlChanges[ccNumber];
                    ccList.forEach(ccEvent => {
                        const eventMs = Math.round(ccEvent.time * 1000);
                        if (eventMs < absoluteFirstMs) absoluteFirstMs = eventMs;

                        initTimeSlot(eventMs);
                        if (parseInt(ccNumber) === 64) timeline[eventMs].sustain = (ccEvent.value > 0.5) ? "S1" : "S0";
                        if (parseInt(ccNumber) === 67) timeline[eventMs].soft = (ccEvent.value > 0.5) ? "P1" : "P0";
                    });
                }
            }
        });

        const timeShiftOffsetMs = absoluteFirstMs === Infinity ? 0 : absoluteFirstMs;
        const sortedKeys = Object.keys(timeline).map(Number).sort((a, b) => a - b);
        let stringSegments = [];
        let lastEventMs = timeShiftOffsetMs; 

        if (sortedKeys.length > 0) {
            sortedKeys.forEach(currentMs => {
                const currentDelta = currentMs - lastEventMs;
                const slot = timeline[currentMs];
                let elements = [];

                slot.notesOn.forEach(pitch => elements.push(pitch));
                slot.notesOff.forEach(pitch => elements.push(`-${pitch}`));
                if (slot.sustain !== null) elements.push(slot.sustain);
                if (slot.soft !== null) elements.push(slot.soft);
                if (slot.velocitySum > 0) elements.push(`V${slot.velocitySum}`);

                if (elements.length > 0) {
                    stringSegments.push(`${currentDelta},${elements.join(",")}`);
                    lastEventMs = currentMs;
                }
            });
            outputArea.value = stringSegments.join("|");
        }

        /* ==========================================
           PART 2: CANVAS PAPER ROLL GENERATION
           ========================================== */
        let rawEvents = [];
        let absoluteFirstY = Infinity;

        midi.tracks.forEach(track => {
            track.notes.forEach(note => {
                const yStart = note.time * SCROLL_SPEED_PX_PER_SEC;
                const height = (note.duration * SCROLL_SPEED_PX_PER_SEC) * 0.9;
                if (yStart < absoluteFirstY) absoluteFirstY = yStart;

                for (let t = 1; t <= TRACKS_COUNT; t++) {
                    const info = getTrackTypeAndData(t);
                    if (info.type === 'NOTE' && info.midi === note.midi) {
                        rawEvents.push({ track: t, rawY: yStart, height: height });
                        const vel8Bit = Math.round(note.velocity * 127);
                        if (vel8Bit & 8)   rawEvents.push({ track: 78, rawY: yStart, height: height });
                        if (vel8Bit & 16)  rawEvents.push({ track: 79, rawY: yStart, height: height });
                        if (vel8Bit & 32)  rawEvents.push({ track: 80, rawY: yStart, height: height });
                        if (vel8Bit & 64)  rawEvents.push({ track: 81, rawY: yStart, height: height });
                        break;
                    }
                }
            });

            if (track.controlChanges) {
                if (track.controlChanges[64]) {
                    const cc64List = track.controlChanges[64];
                    let sustainOnTime = null;
                    cc64List.forEach(ccEvent => {
                        const yPos = ccEvent.time * SCROLL_SPEED_PX_PER_SEC;
                        if (ccEvent.value > 0.5) {
                            if (sustainOnTime === null) sustainOnTime = ccEvent.time;
                        } else {
                            if (sustainOnTime !== null) {
                                const yStart = sustainOnTime * SCROLL_SPEED_PX_PER_SEC;
                                const height = Math.max((ccEvent.time - sustainOnTime) * SCROLL_SPEED_PX_PER_SEC, 12);
                                if (yStart < absoluteFirstY) absoluteFirstY = yStart;
                                rawEvents.push({ track: 77, rawY: yStart, height: height });
                                sustainOnTime = null;
                            }
                        }
                    });
                    if (sustainOnTime !== null) {
                        const yStart = sustainOnTime * SCROLL_SPEED_PX_PER_SEC;
                        const duration = midi.duration - sustainOnTime;
                        const height = Math.max(duration * SCROLL_SPEED_PX_PER_SEC, 12);
                        if (yStart < absoluteFirstY) absoluteFirstY = yStart;
                        rawEvents.push({ track: 77, rawY: yStart, height: height });
                    }
                }
                if (track.controlChanges[67]) {
                    const cc67List = track.controlChanges[67];
                    cc67List.forEach(ccEvent => {
                        if (ccEvent.value > 0.5) {
                            const yStart = ccEvent.time * SCROLL_SPEED_PX_PER_SEC;
                            if (yStart < absoluteFirstY) absoluteFirstY = yStart;
                            rawEvents.push({ track: 76, rawY: yStart, height: 25 });
                        }
                    });
                }
            }
        });

        if (rawEvents.length === 0 && stringSegments.length === 0) {
            statusDiv.innerText = "Error: No notes or events found in this MIDI file.";
            return;
        }

        const timeShiftOffsetY = absoluteFirstY === Infinity ? 0 : absoluteFirstY;
        let events = [];
        let maxShiftedY = 0;

        rawEvents.forEach(ev => {
            const adjustedY = ev.rawY - timeShiftOffsetY;
            events.push({ track: ev.track, y: adjustedY, height: ev.height });
            if (adjustedY + ev.height > maxShiftedY) {
                maxShiftedY = adjustedY + ev.height;
            }
        });

        let canvasCount = 0;
        if(events.length > 0){
            const totalHeightNeeded = maxShiftedY + 200; 
            canvasCount = Math.ceil(totalHeightNeeded / CANVAS_HEIGHT);

            for (let i = 0; i < canvasCount; i++) {
                const canvas = document.createElement('canvas');
                canvas.width = CANVAS_WIDTH;
                canvas.height = CANVAS_HEIGHT;
                
                const ctx = canvas.getContext('2d');
                ctx.save();
                ctx.translate(CANVAS_WIDTH, 0);
                ctx.scale(-1, 1);

                ctx.fillStyle = '#fbf6eb';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.strokeStyle = 'rgba(210, 190, 160, 0.4)';
                ctx.lineWidth = 1;
                for (let t = 0; t <= TRACKS_COUNT; t++) {
                    const x = MARGIN_X + (t * TRACK_WIDTH);
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, CANVAS_HEIGHT);
                    ctx.stroke();
                }

                const currentYOffsetStart = i * CANVAS_HEIGHT;
                const currentYOffsetEnd = currentYOffsetStart + CANVAS_HEIGHT;

                ctx.save();
                ctx.globalCompositeOperation = "destination-out";

                events.forEach(ev => {
                    if (ev.y + ev.height >= currentYOffsetStart && ev.y <= currentYOffsetEnd) {
                        const renderY = ev.y - currentYOffsetStart;
                        const renderHeight = ev.height;
                        const renderX = MARGIN_X + ((ev.track - 1) * TRACK_WIDTH) + 2;
                        const renderWidth = TRACK_WIDTH - 4;

                        drawSlot(ctx, renderX, renderY, renderWidth, renderHeight);
                    }
                });
                ctx.restore();

                if (i === canvasCount - 1) {
                    const coinTripTrack = 83;
                    const coinTripX = MARGIN_X + ((coinTripTrack - 1) * TRACK_WIDTH) + 2;
                    const coinTripWidth = TRACK_WIDTH - 4;
                    const coinTripStartY = Math.max(maxShiftedY + 20, currentYOffsetStart);
                    const coinTripEndY = currentYOffsetEnd;

                    if (coinTripStartY < coinTripEndY) {
                        ctx.save();
                        ctx.globalCompositeOperation = "destination-out";
                        drawSlot(ctx, coinTripX, coinTripStartY - currentYOffsetStart, coinTripWidth, coinTripEndY - coinTripStartY);
                        ctx.restore();
                    }
                }
                
                ctx.restore();
                const label = document.createElement('div');
                label.className = 'canvas-label';
                label.innerText = `Sheet Frame Segment ${i + 1} of ${canvasCount}`;
                
                outputContainer.appendChild(canvas);
                outputContainer.appendChild(label);
                
                generatedCanvases.push(canvas);
            }
        }
        
        statusDiv.innerText = `Compiled ${canvasCount} sheets & string data (${outputArea.value.length.toLocaleString()} characters). Flowing top-to-bottom. Ready for download.`;
        downloadBtn.style.display = 'inline-block';
    });

    // Copy to clipboard
    document.getElementById('copy-btn').addEventListener('click', () => {
        const textOutput = document.getElementById('string-output');
        if (!textOutput.value) return;
        textOutput.select();
        textOutput.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(textOutput.value);
        alert("Piano Roll data string copied securely to clipboard!");
    });

    // Batch download
    document.getElementById('download-btn').addEventListener('click', () => {
        if (!generatedCanvases.length) return;

        let userTitle = document.getElementById('custom-title').value.trim();
        if(!userTitle) userTitle = "piano-roll";
        const safeTitle = userTitle.replace(/\s+/g, "_");

        generatedCanvases.forEach((canvas, index) => {
            setTimeout(() => {
                const link = document.createElement('a');
                link.download = `${safeTitle}-page-${index + 1}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }, index * 250); 
        });
    });
</script>

</body>
</html>
